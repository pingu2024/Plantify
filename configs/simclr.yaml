project:
  name: plantify-dl
  seed: 42
  deterministic: false

paths:
  plantvillage_root: "PlantVillage-Dataset/raw/color"
  runs_dir: "runs"
  checkpoints_dir: "checkpoints"

data:
  # Faster demo pretrain: smaller images + larger batch.
  image_size: 96
  batch_size: 256
  num_workers: 4
  pin_memory: false
  prefetch_factor: 2

model:
  imagenet_pretrained: false
  projection_dim: 128
  hidden_dim: 512

ssl:
  temperature: 0.5
  # 3–5 epochs is usually enough for a course demo uplift.
  epochs: 5
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  momentum: 0.9
  drop_last: true

logging:
  log_every_steps: 50
  tensorboard: true
