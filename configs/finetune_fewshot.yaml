project:
  name: plantify-dl
  seed: 42
  deterministic: false

paths:
  target_root: "data/corn_leaf"
  runs_dir: "runs"
  checkpoints_dir: "checkpoints"
  # set per-run (B3 uses PV supervised checkpoint; B4 uses simclr encoder checkpoint)
  pretrained_path: "checkpoints/pv_sup_1778102707_best.pt"

data:
  image_size: 128
  batch_size: 32
  num_workers: 4
  pin_memory: false
  prefetch_factor: 2
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  # Few-shot: 10 labeled images/class (5 classes -> 50 total)
  fewshot_per_class: 10

# init: imagenet | scratch | ssl | supervised_pv
finetune:
  init: scratch
  dropout: 0.2
  # Key few-shot trick: protect pretrained features early.
  freeze_backbone_epochs: 0
  epochs: 20
  # Lower LR to avoid wiping pretrained weights.
  lr: 0.00005
  weight_decay: 0.0001
  optimizer: adamw
  momentum: 0.9
  label_smoothing: 0.0

model:
  backbone: resnet18

logging:
  log_every_steps: 10
  tensorboard: true

